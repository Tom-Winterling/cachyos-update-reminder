[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachyos-update-reminder"
version = "0.1.0"
description = "A lightweight desktop application for monitoring available updates on CachyOS."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.11,<7",
]

[tool.setuptools.packages.find]
where = ["."]
